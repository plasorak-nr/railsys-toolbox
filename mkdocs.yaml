site_name: rsys-analyser
site_description: Railway simulation analysis toolkit
site_url: https://<your-github-username>.github.io/rsys-analyser/
repo_url: https://github.com/<your-github-username>/rsys-analyser
repo_name: <your-github-username>/rsys-analyser

theme:
  name: material

nav:
  - Home: index.md
  - API: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            docstring_style: google
            inherited_members: true
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true
