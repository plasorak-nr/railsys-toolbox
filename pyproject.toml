[project]
name = "rsys-toolbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.18.2",
    "pandas>=3.0.3",
    "poethepoet>=0.46.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "ruff>=0.15.13",
    "ty>=0.0.46",
    "typer>=0.25.1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true


[project.scripts]
rsys-toolbox = "rsys_toolbox.main:app"


[tool.ruff]
line-length = 160
preview = true
extend-exclude = ["*.ipynb"] # Blank check for python notebooks

[tool.ruff.lint]
select = [
  "RUF", # Ruff-specific rules
  "F",   # pyflakes
  "LOG", # logging
  "G",   # logging format
  "PT",  # pytests
  "SIM", # simple code
  "PTH", # path
  "I",   # import sorting
  "E",   # pycodestyle (errors)
  "W",   # pycodestyle (warnings)
  "ANN", # annotations
  "DOC", # docstrings
  "D",   # docstrings
]
ignore = [
  "D203", # incompatible with D211
  "D213", # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"rsys_toolbox/__init__.py" = ["RUF067"]
"rsys_toolbox/core/__init__.py" = ["RUF067"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]

# These tasks can be ran by using `uv run poe <task_name>
[tool.poe.tasks]

sync = "uv sync --all-extras"

ruff-read = [
  { cmd = "ruff check ." },
  { cmd = "ruff format --check ." }
]

ruff-write = [
  { cmd = "ruff check --fix ." },
  { cmd = "ruff format ." }
]

ty-src = "ty check rsys_toolbox --output-format concise"
ty-test = "ty check test --output-format concise"

test = "pytest ."
docs = "mkdocs build"
docs-serve = "mkdocs serve"

verify = [
  "ruff-read",
  "ty-src",
  "ty-test",
  "test"
]

format = [
  "ruff-write",
]
