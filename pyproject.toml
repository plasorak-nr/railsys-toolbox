[project]
name = "rsys-analyser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.18.2",
    "pandas>=3.0.3",
    "poethepoet>=0.46.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "ruff>=0.15.13",
    "ty>=0.0.46",
    "typer>=0.25.1",
]


[project.scripts]
rsys-analyser = "rsys_analyser.main:app"


[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["ALL"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
