site_name: rsys-toolbox
site_description: Railway simulation analysis toolkit
site_url: https://networkrail-p-and-st.github.io/railsys-toolbox/
repo_url: https://github.com/networkrail-p-and-st/railsys-toolbox
repo_name: networkrail-p-and-st/railsys-toolbox

theme:
  name: material
  features:
    - navigation.footer

nav:
  - Home: index.md
  - API: api.md
  - Tutorial:
      - Overview: tutorial/index.md
      - Setup: tutorial/setup.md
      - Load Data: tutorial/load-data.md
      - Exploration: tutorial/exploration.md
      - Punctuality: tutorial/punctuality.md
      - Train Profiles: tutorial/train-profiles.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: false
            show_root_full_path: false
            heading_level: 3
            docstring_style: google
            inherited_members: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
